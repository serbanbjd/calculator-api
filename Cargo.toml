[package]
name = "calculator-api"
version = "0.1.0"
edition = "2024"
description = "Stateless HTTP calculator with exact decimal arithmetic"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
