# ADR-0007: fmt, clippy, tests and the Docker build on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: calculator-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (AC-8)
        run: |
          docker run -d --name calc -e PORT=9000 -p 9000:9000 calculator-api:ci
          for i in $(seq 1 20); do curl -fsS localhost:9000/health && break; sleep 1; done
          curl -fsS -X POST localhost:9000/v1/calculate \
            -H 'content-type: application/json' \
            -d '{"op":"add","a":"0.1","b":"0.2"}' | tee /tmp/out.json
          grep -q '"result":"0.3"' /tmp/out.json
          curl -fsS -o /dev/null localhost:9000/docs/
